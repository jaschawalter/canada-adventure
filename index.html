  {title:'Catch BEAR SAFETY phrases!',yes:['Do not run','Make noise','Keep eyes open','Do not surprise bears','Keep your backpack'],no:['Run away','Feed bears','Drop your bag','Chase a bear','Surprise bears']},
  {title:'Catch TRAVEL ITEMS!',yes:['backpack','raincoat','water bottle','boots','map'],no:['sofa','television','fridge','piano','desk']}
 ];
 const cat=pick(categories);
 const icon=w=>({'beaver':'🦫','moose':'🫎','wolf':'🐺','eagle':'🦅','bison':'🦬','piano':'🎹','sofa':'🛋️','pencil':'✏️','car':'🚗','pizza':'🍕','backpack':'🎒','raincoat':'🧥','water bottle':'💧','boots':'🥾','map':'🗺️'}[w]||'🍁');
 st.innerHTML=`<div class="player-head"><b>${esc(cat.title)}</b><b class="clock">⏱️ 36s</b></div><div class="catch-field" role="group" aria-label="Swipe anywhere in this area to move the bear left and right; catch correct falling items"><div class="bear-mark">🐻</div></div><div class="feedback">👆 Swipe left or right to move the bear. Catch the correct words, avoid the wrong ones! You can also tap a falling word.</div><p class="catch-stats muted">✅ 0 caught · ❌ 0 mistakes</p><div class="runner-controls"><button class="btn small" data-bear-left aria-label="Move bear left">⬅️ Left</button><button class="btn small" data-bear-middle aria-label="Move bear to the middle">🐻 Middle</button><button class="btn small" data-bear-right aria-label="Move bear right">➡️ Right</button></div>`;
 const field=$('.catch-field',st),bear=$('.bear-mark',st);
 let bearX=field.clientWidth/2,dragPointer=null;
 function moveBear(clientX){const rect=field.getBoundingClientRect();bearX=Math.max(23,Math.min(rect.width-23,clientX-rect.left));bear.style.left=bearX+'px'}
 field.addEventListener('pointerdown',e=>{if(!alive)return;dragPointer=e.pointerId;field.setPointerCapture(e.pointerId);moveBear(e.clientX);if(e.cancelable)e.preventDefault()});
 field.addEventListener('pointermove',e=>{if(!alive||dragPointer!==e.pointerId)return;moveBear(e.clientX);if(e.cancelable)e.preventDefault()});
 function stopDrag(e){if(dragPointer===e.pointerId)dragPointer=null}
 field.addEventListener('pointerup',stopDrag);field.addEventListener('pointercancel',stopDrag);
 // Accessible backup controls for keyboard users and browsers with limited swipe support.
 $('[data-bear-left]',st).onclick=()=>moveBear(field.getBoundingClientRect().left+bearX-field.clientWidth*.23);
 $('[data-bear-middle]',st).onclick=()=>moveBear(field.getBoundingClientRect().left+field.clientWidth/2);
 $('[data-bear-right]',st).onclick=()=>moveBear(field.getBoundingClientRect().left+bearX+field.clientWidth*.23);
 function result(item){if(!alive||!items.includes(item))return;items=items.filter(i=>i!==item);item.el.remove();progress(p,item.good);if(item.good){caught++;addScore(p,8);$('.feedback',st).className='feedback good';$('.feedback',st).textContent=`✅ ${item.word} — correct! +8 points`}
 else{mistakes++;p.mistakes.push({q:`Catch only: ${cat.title}`,answer:cat.yes.join(', ')});$('.feedback',st).className='feedback bad';$('.feedback',st).textContent=`💡 ${item.word} does not belong here.`}
 status(panel,p);$('.catch-stats',st).textContent=`✅ ${caught} caught · ❌ ${mistakes} mistakes`}
 function spawn(){if(!alive)return;const good=Math.random()<.57,word=pick(good?cat.yes:cat.no),el=document.createElement('button');el.type='button';el.className='catch-item';el.style.top='-70px';el.innerHTML=`<span>${icon(word)}</span>${esc(word)}`;field.append(el);const width=field.clientWidth;const x=Math.max(4,Math.random()*Math.max(1,width-110));el.style.left=x+'px';let item={el,y:-70,speed:rand(75,115),good,word,x};items.push(item);
 // Tapping remains an alternative to dragging the bear.
 el.addEventListener('click',e=>{e.stopPropagation();result(item)})}
 function frame(ts){if(!alive)return;if(!lastFrame)lastFrame=ts;const dt=Math.min((ts-lastFrame)/1000,.1);lastFrame=ts;if(ts-lastSpawn>1000){spawn();lastSpawn=ts}
 items=[...items].filter(it=>{if(!items.includes(it))return false;it.y+=it.speed*dt;it.el.style.top=it.y+'px';const itemCenter=it.x+it.el.offsetWidth/2;const catchLine=field.clientHeight-47;
 if(it.y+it.el.offsetHeight>=catchLine&&it.y<field.clientHeight-6&&Math.abs(itemCenter-bearX)<Math.max(30,it.el.offsetWidth*.38)){result(it);return false}
 if(it.y>field.clientHeight+15){it.el.remove();return false}return true});requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
 cleanups.push(()=>{alive=false;items.forEach(i=>i.el.remove())});
 timer(()=>{if(!alive)return;time--;const clock=$('.clock',st);if(clock)clock.textContent=`⏱️ ${time}s`;if(time<=0){alive=false;done(panel,p,'catch',`${caught} useful items caught!`)}},1000)
}
function hockeyGame(panel,p){const st=stageOf(panel);let round=0,goals=0;function next(){if(round>=5){done(panel,p,'hockey',`${goals} hockey goals scored!`);return}round++;let q=questionFor(p,q=>['M2','M7','M1'].includes(q.m)),locked=false;st.innerHTML=`<div class="muted">🏒 Shot ${round} of 5</div><div class="question">${esc(q.q)}</div><div class="choices">${shuffle(q.options).map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Answer correctly to unlock a shot on goal!</div><div class="hockey-rink hidden"><div class="goal">🥅 GOAL</div><div class="puck" role="button" tabindex="0" aria-label="Swipe puck upward to shoot">●</div></div><button class="btn primary hidden" data-shoot>🏒 SHOOT!</button>`;$$('.choice',st).forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.textContent===q.answer;$('.feedback',st).textContent=answerFeedback(ok,p,q);status(panel,p);if(!ok){$$('.choice',st).forEach(x=>x.disabled=true);later(next,1700);return}$$('.choice',st).forEach(x=>x.disabled=true);$('.hockey-rink',st).classList.remove('hidden');$('[data-shoot]',st).classList.remove('hidden');$('.feedback',st).textContent='✅ Correct! Swipe the puck towards the net — or tap SHOOT.';let shot=false;function shoot(){if(shot)return;shot=true;goals++;addScore(p,10);status(panel,p);$('.puck',st).classList.add('shot');$('.puck',st).style.transform='translateY(-125px)';$('.feedback',st).className='feedback good';$('.feedback',st).textContent='🥅 GOAL! +10 points';later(next,1000)}$('[data-shoot]',st).onclick=shoot;let puck=$('.puck',st),startY=null;puck.onpointerdown=e=>{startY=e.clientY;puck.setPointerCapture(e.pointerId)};puck.onpointerup=e=>{if(startY!==null&&startY-e.clientY>25)shoot();startY=null};puck.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')shoot()}})}next()}
function packingGame(panel,p){const st=stageOf(panel);let n=0;function next(){if(n>=PACK.length){done(panel,p,'packing','Your bags are packed!');return}let pack=PACK[n],selected=new Set();n++;st.innerHTML=`<div class="muted">Packing mission ${n}/${PACK.length}</div><div class="question">${esc(pack.title)}</div><p class="muted">${esc(pack.desc)}</p><div class="choice-list">${shuffle(pack.items).map(([icon,w,yes])=>`<button class="packitem" data-word="${esc(w)}"><em>${icon}</em>${esc(w)}</button>`).join('')}</div><div style="margin-top:12px"><button class="btn primary" data-check>🎒 Check my bag</button></div><div class="feedback">Select four items, then check your bag.</div>`;$$('.packitem',st).forEach(b=>b.onclick=()=>{let w=b.dataset.word;if(selected.has(w))selected.delete(w);else if(selected.size<4)selected.add(w);else{toast('Choose exactly four items.');return}b.classList.toggle('selected',selected.has(w))});$('[data-check]',st).onclick=()=>{if(selected.size!==4){$('.feedback',st).textContent='💡 Please select exactly four items.';return}let correct=pack.items.filter(x=>x[2]).map(x=>x[1]),count=correct.filter(w=>selected.has(w)).length,ok=count===4;progress(p,ok);addScore(p,count*5);status(panel,p);$('.feedback',st).className='feedback '+(ok?'good':'bad');$('.feedback',st).textContent=ok?'✅ Perfect packing! +20 points':`💡 ${count}/4 useful items. You need: ${correct.join(', ')}.`;if(!ok)p.mistakes.push({q:pack.title,answer:correct.join(', ')});$$('.packitem',st).forEach(x=>{x.disabled=true;x.classList.add(correct.includes(x.dataset.word)?'correct':'')});$('[data-check]',st).disabled=true;later(next,2100)}}next()}
function explorerGame(panel,p){const st=stageOf(panel);let pass=0,sub=0;function next(){if(pass>=READINGS.length){done(panel,p,'explorer','You explored all three texts!');return}let r=READINGS[pass],q=r.qs[sub],opts=shuffle([q[1],...q[2]]);st.innerHTML=`<div class="muted">Reading ${pass+1}/3 · Question ${sub+1}/2</div><h3>${esc(r.title)}</h3><p class="passage">${esc(r.text)}</p><div class="question">${esc(q[0])}</div><div class="choices">${opts.map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Read carefully. Find the answer in the text.</div>`;let lock=false;$$('.choice',st).forEach(b=>b.onclick=()=>{if(lock)return;lock=true;let ok=b.textContent===q[1];progress(p,ok);if(ok)addScore(p,10);else p.mistakes.push({q:q[0],answer:q[1]});status(panel,p);$('.feedback',st).className='feedback '+(ok?'good':'bad');$('.feedback',st).textContent=ok?'✅ Correct! +10 points':`💡 Read again: ${q[1]}.`;sub++;if(sub===2){sub=0;pass++}later(next,1450)})}next()}
function bossGame(panel,p){const st=stageOf(panel);let stage=0,lives=3,won=0;function lose(q,answer){lives--;progress(p,false);p.mistakes.push({q,answer});status(panel,p)}function win(){won++;progress(p,true);addScore(p,20);status(panel,p)}function finishStage(){if(lives<=0){done(panel,p,'boss',`Final Boss: ${won} stages cleared. Try again!`,false);return}stage++;later(draw,900)}function title(){let x=BOSS_STAGES[stage];return `<div class="player-head"><b>🏆 ${esc(x.title)}</b><b>❤️ ${'❤️'.repeat(lives)} · ${won}/5</b></div>`}function draw(){if(stage>=5){done(panel,p,'boss','YOU BEAT THE FINAL BOSS! 🎉');return}if(lives<=0){done(panel,p,'boss',`You cleared ${won} of 5 stages!`,false);return}let type=BOSS_STAGES[stage].type;if(type==='quiz'){let q=questionFor(p,q=>q.m==='M2');st.innerHTML=title()+`<div class="question">${esc(q.q)}</div><div class="choices">${shuffle(q.options).map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Choose the best answer.</div>`;$$('.choice',st).forEach(b=>b.onclick=()=>{let ok=b.textContent===q.answer;ok?win():lose(q.q,q.answer);$('.feedback',st).textContent=ok?'✅ Stage passed! +20':`💡 ${q.hint}`;$$('.choice',st).forEach(x=>x.disabled=true);finishStage()})}else if(type==='match'){let pair=pick(PAIRS);let options=shuffle([pair[1],...shuffle(PAIRS.filter(x=>x[1]!==pair[1]).map(x=>x[1])).slice(0,3)]);st.innerHTML=title()+`<div class="question">Find the correct meaning of “${esc(pair[0])}”.</div><div class="choices">${options.map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Match the word and the definition.</div>`;$$('.choice',st).forEach(b=>b.onclick=()=>{let ok=b.textContent===pair[1];ok?win():lose(pair[0],pair[1]);$('.feedback',st).textContent=ok?'✅ Stage passed! +20':`💡 ${pair[0]} = ${pair[1]}`;$$('.choice',st).forEach(x=>x.disabled=true);finishStage()})}else if(type==='fill'){st.innerHTML=title()+`<div class="question">Complete the sentence:</div><p class="passage">Canada has two official languages: English and ________.</p><label class="boss-label" for="bossword">Write the missing English word</label><input class="boss-input" id="bossword" type="text" autocomplete="off" placeholder="Type one word"><p><button class="btn primary" data-submit>Check answer</button></p><div class="feedback">Spelling matters. You can use the keyboard.</div>`;let submit=()=>{let val=$('#bossword',st).value.trim().toLowerCase();let ok=val==='french';ok?win():lose('Canada’s official languages','French');$('.feedback',st).textContent=ok?'✅ Stage passed! +20':'💡 The missing word is French.';$('[data-submit]',st).disabled=true;$('#bossword',st).disabled=true;finishStage()};$('[data-submit]',st).onclick=submit;$('#bossword',st).onkeydown=e=>{if(e.key==='Enter')submit()}}else if(type==='order'){let original=['Ottawa','is','the','capital','of','Canada.'],tokens=shuffle(original.map((x,i)=>({x,id:i})));let result=[];st.innerHTML=title()+`<div class="question">Build a correct sentence.</div><div class="boss-order" id="wordOrder">${tokens.map(({x,id})=>`<button class="tile" data-id="${id}">${esc(x)}</button>`).join('')}</div><p class="passage" id="built">Tap the words in the correct order.</p><button class="btn primary" data-check>Check sentence</button> <button class="btn small" data-clear>Clear</button><div class="feedback">Use all six words.</div>`;$$('[data-id]',st).forEach(b=>b.onclick=()=>{if(result.includes(+b.dataset.id))return;result.push(+b.dataset.id);b.classList.add('selected');$('#built',st).textContent=result.map(id=>original[id]).join(' ')});$('[data-clear]',st).onclick=()=>{result=[];$$('[data-id]',st).forEach(b=>b.classList.remove('selected'));$('#built',st).textContent='Tap the words in the correct order.'};$('[data-check]',st).onclick=()=>{let ok=result.join(',')==='0,1,2,3,4,5';ok?win():lose('Correct sentence','Ottawa is the capital of Canada.');$('.feedback',st).textContent=ok?'✅ Stage passed! +20':'💡 Ottawa is the capital of Canada.';$$('.tile',st).forEach(b=>b.disabled=true);$('[data-check]',st).disabled=true;finishStage()}}else if(type==='multi'){let options=shuffle([['Keep your eyes open.',true],['Do not surprise a bear.',true],['Make lots of noise.',true],['Run towards the bear.',false],['Drop your backpack.',false],['Feed the bear.',false]]),sel=new Set();st.innerHTML=title()+`<div class="question">Choose THREE instructions from the M4 bear-country worksheet.</div><div class="choices">${options.map(([txt])=>`<button class="choice" data-choice="${esc(txt)}">${esc(txt)}</button>`).join('')}</div><p><button class="btn primary" data-check>Check three answers</button></p><div class="feedback">Select exactly three instructions.</div>`;$$('[data-choice]',st).forEach(b=>b.onclick=()=>{let t=b.dataset.choice;if(sel.has(t))sel.delete(t);else if(sel.size<3)sel.add(t);else return;b.classList.toggle('correct',sel.has(t))});$('[data-check]',st).onclick=()=>{if(sel.size!==3){$('.feedback',st).textContent='Select exactly three answers.';return}let ok=options.filter(([w,yes])=>yes&&sel.has(w)).length===3;ok?win():lose('M4 bear-country phrases','Keep your eyes open; Do not surprise a bear; Make lots of noise.');$('.feedback',st).textContent=ok?'✅ Boss defeated! +20':'💡 Worksheet phrases: keep your eyes open; do not surprise a bear; make lots of noise.';$$('[data-choice]',st).forEach(b=>b.disabled=true);$('[data-check]',st).disabled=true;finishStage()}}}draw()}
function makeGame(id,panel,p){status(panel,p);({quiz:()=>multipleChoice(panel,p,{count:9,trueFalse:true,game:'quiz'}),runner:()=>runnerGame(panel,p),memory:()=>memoryGame(panel,p),catch:()=>catchGame(panel,p),match:()=>matchGame(panel,p),speed:()=>speedGame(panel,p),hockey:()=>hockeyGame(panel,p),packing:()=>packingGame(panel,p),explorer:()=>explorerGame(panel,p),boss:()=>bossGame(panel,p)})[id]()}
function showCertificate(){cleanup();currentGame='certificate';let labels=completed.size>=10?'CANADA CHAMPION':completed.size>=6?'CANADA EXPLORER':completed.size>=3?'CANADIAN WILDLIFE RANGER':'CANADA ADVENTURER';$('#app').innerHTML=`<section class="game-shell"><div class="game-head noprint"><h2 class="game-title">🏅 Your Canada Adventure Award</h2><div class="game-head-actions"><button class="btn mint" id="backCert">← Map</button><button class="btn primary" id="printCert">🖨️ Print / Save PDF</button></div></div><div class="cert"><div class="laurel">🍁 🏆 🍁</div><p style="font-size:1.4rem;font-weight:900;letter-spacing:.16em">CERTIFICATE OF ACHIEVEMENT</p><h2>CANADA ADVENTURE</h2><p>This award is presented to</p><input aria-label="Your name for the certificate" id="awardName" placeholder="Your name" maxlength="45"><h3>${labels}</h3><p>for completing Canadian English-learning challenges</p><div class="stars">${'★'.repeat(Math.max(1,Math.ceil(completed.size/2)))}${'☆'.repeat(Math.max(0,5-Math.ceil(completed.size/2)))}</div><p class="bigscore">⭐ ${total} points</p><p><strong>🗺️ ${completed.size} / 10 games completed</strong></p><p class="cert-note">Class 9 · Canada learning buffet · ${new Date().toLocaleDateString('en-GB')}</p></div><div class="bottomline noprint"><span class="hint">Your name stays in this tab only. Reloading clears all scores and your name.</span></div></section>`;$('#backCert').onclick=goHome;$('#printCert').onclick=()=>window.print();window.scrollTo({top:0,behavior:'instant'})}
function askRestart(){let host=$('#modalHost');host.innerHTML=`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="restartTitle"><h3 id="restartTitle">↻ Start a new adventure?</h3><p>This erases all points and completed games in the current tab.</p><button class="btn coral" id="confirmRestart">Yes, restart</button><button class="btn mint" id="cancelRestart">Keep playing</button></div></div>`;$('#cancelRestart').onclick=()=>host.innerHTML='';$('#confirmRestart').onclick=()=>{host.innerHTML='';cleanup();startSession();goHome()}}
$('#homeTop').onclick=goHome;$('#certificateTop').onclick=showCertificate;$('#restartTop').onclick=askRestart;
startSession();renderMap();
