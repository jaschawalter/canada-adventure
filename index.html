function bossGame(panel,p){const st=stageOf(panel);let stage=0,lives=3,won=0;function lose(q,answer){lives--;progress(p,false);p.mistakes.push({q,answer});status(panel,p)}function win(){won++;progress(p,true);addScore(p,20);status(panel,p)}function finishStage(){if(lives<=0){done(panel,p,'boss',`Final Boss: ${won} stages cleared. Try again!`,false);return}stage++;later(draw,900)}function title(){let x=BOSS_STAGES[stage];return `<div class="player-head"><b>🏆 ${esc(x.title)}</b><b>❤️ ${'❤️'.repeat(lives)} · ${won}/5</b></div>`}function draw(){if(stage>=5){done(panel,p,'boss','YOU BEAT THE FINAL BOSS! 🎉');return}if(lives<=0){done(panel,p,'boss',`You cleared ${won} of 5 stages!`,false);return}let type=BOSS_STAGES[stage].type;if(type==='quiz'){let q=questionFor(p,q=>q.m==='M2');st.innerHTML=title()+`<div class="question">${esc(q.q)}</div><div class="choices">${shuffle(q.options).map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Choose the best answer.</div>`;$$('.choice',st).forEach(b=>b.onclick=()=>{let ok=b.textContent===q.answer;ok?win():lose(q.q,q.answer);$('.feedback',st).textContent=ok?'✅ Stage passed! +20':`💡 ${q.hint}`;$$('.choice',st).forEach(x=>x.disabled=true);finishStage()})}else if(type==='match'){let pair=pick(PAIRS);let options=shuffle([pair[1],...shuffle(PAIRS.filter(x=>x[1]!==pair[1]).map(x=>x[1])).slice(0,3)]);st.innerHTML=title()+`<div class="question">Find the correct meaning of “${esc(pair[0])}”.</div><div class="choices">${options.map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="feedback">Match the word and the definition.</div>`;$$('.choice',st).forEach(b=>b.onclick=()=>{let ok=b.textContent===pair[1];ok?win():lose(pair[0],pair[1]);$('.feedback',st).textContent=ok?'✅ Stage passed! +20':`💡 ${pair[0]} = ${pair[1]}`;$$('.choice',st).forEach(x=>x.disabled=true);finishStage()})}else if(type==='fill'){st.innerHTML=title()+`<div class="question">Complete the sentence:</div><p class="passage">Canada has two official languages: English and ________.</p><label class="boss-label" for="bossword">Write the missing English word</label><input class="boss-input" id="bossword" type="text" autocomplete="off" placeholder="Type one word"><p><button class="btn primary" data-submit>Check answer</button></p><div class="feedback">Spelling matters. You can use the keyboard.</div>`;let submit=()=>{let val=$('#bossword',st).value.trim().toLowerCase();let ok=val==='french';ok?win():lose('Canada’s official languages','French');$('.feedback',st).textContent=ok?'✅ Stage passed! +20':'💡 The missing word is French.';$('[data-submit]',st).disabled=true;$('#bossword',st).disabled=true;finishStage()};$('[data-submit]',st).onclick=submit;$('#bossword',st).onkeydown=e=>{if(e.key==='Enter')submit()}}else if(type==='order'){let original=['Ottawa','is','the','capital','of','Canada.'],tokens=shuffle(original.map((x,i)=>({x,id:i})));let result=[];st.innerHTML=title()+`<div class="question">Build a correct sentence.</div><div class="boss-order" id="wordOrder">${tokens.map(({x,id})=>`<button class="tile" data-id="${id}">${esc(x)}</button>`).join('')}</div><p class="passage" id="built">Tap the words in the correct order.</p><button class="btn primary" data-check>Check sentence</button> <button class="btn small" data-clear>Clear</button><div class="feedback">Use all six words.</div>`;$$('[data-id]',st).forEach(b=>b.onclick=()=>{if(result.includes(+b.dataset.id))return;result.push(+b.dataset.id);b.classList.add('selected');$('#built',st).textContent=result.map(id=>original[id]).join(' ')});$('[data-clear]',st).onclick=()=>{result=[];$$('[data-id]',st).forEach(b=>b.classList.remove('selected'));$('#built',st).textContent='Tap the words in the correct order.'};$('[data-check]',st).onclick=()=>{let ok=result.join(',')==='0,1,2,3,4,5';ok?win():lose('Correct sentence','Ottawa is the capital of Canada.');$('.feedback',st).textContent=ok?'✅ Stage passed! +20':'💡 Ottawa is the capital of Canada.';$$('.tile',st).forEach(b=>b.disabled=true);$('[data-check]',st).disabled=true;finishStage()}}else if(type==='multi'){let options=shuffle([['Keep your eyes open.',true],['Do not surprise a bear.',true],['Make lots of noise.',true],['Run towards the bear.',false],['Drop your backpack.',false],['Feed the bear.',false]]),sel=new Set();st.innerHTML=title()+`<div class="question">Choose THREE instructions from the M4 bear-country worksheet.</div><div class="choices">${options.map(([txt])=>`<button class="choice" data-choice="${esc(txt)}">${esc(txt)}</button>`).join('')}</div><p><button class="btn primary" data-check>Check three answers</button></p><div class="feedback">Select exactly three instructions.</div>`;$$('[data-choice]',st).forEach(b=>b.onclick=()=>{let t=b.dataset.choice;if(sel.has(t))sel.delete(t);else if(sel.size<3)sel.add(t);else return;b.classList.toggle('correct',sel.has(t))});$('[data-check]',st).onclick=()=>{if(sel.size!==3){$('.feedback',st).textContent='Select exactly three answers.';return}let ok=options.filter(([w,yes])=>yes&&sel.has(w)).length===3;ok?win():lose('M4 bear-country phrases','Keep your eyes open; Do not surprise a bear; Make lots of noise.');$('.feedback',st).textContent=ok?'✅ Boss defeated! +20':'💡 Worksheet phrases: keep your eyes open; do not surprise a bear; make lots of noise.';$$('[data-choice]',st).forEach(b=>b.disabled=true);$('[data-check]',st).disabled=true;finishStage()}}}draw()}
function makeGame(id,panel,p){status(panel,p);({quiz:()=>multipleChoice(panel,p,{count:9,trueFalse:true,game:'quiz'}),runner:()=>runnerGame(panel,p),memory:()=>memoryGame(panel,p),catch:()=>catchGame(panel,p),match:()=>matchGame(panel,p),speed:()=>speedGame(panel,p),hockey:()=>hockeyGame(panel,p),packing:()=>packingGame(panel,p),explorer:()=>explorerGame(panel,p),boss:()=>bossGame(panel,p)})[id]()}
function showCertificate(){cleanup();currentGame='certificate';let labels=completed.size>=10?'CANADA CHAMPION':completed.size>=6?'CANADA EXPLORER':completed.size>=3?'CANADIAN WILDLIFE RANGER':'CANADA ADVENTURER';$('#app').innerHTML=`<section class="game-shell"><div class="game-head noprint"><h2 class="game-title">🏅 Your Canada Adventure Award</h2><div class="game-head-actions"><button class="btn mint" id="backCert">← Map</button><button class="btn primary" id="printCert">🖨️ Print / Save PDF</button></div></div><div class="cert"><div class="laurel">🍁 🏆 🍁</div><p style="font-size:1.4rem;font-weight:900;letter-spacing:.16em">CERTIFICATE OF ACHIEVEMENT</p><h2>CANADA ADVENTURE</h2><p>This award is presented to</p><input aria-label="Your name for the certificate" id="awardName" placeholder="Your name" maxlength="45"><h3>${labels}</h3><p>for completing Canadian English-learning challenges</p><div class="stars">${'★'.repeat(Math.max(1,Math.ceil(completed.size/2)))}${'☆'.repeat(Math.max(0,5-Math.ceil(completed.size/2)))}</div><p class="bigscore">⭐ ${total} points</p><p><strong>🗺️ ${completed.size} / 10 games completed</strong></p><p class="cert-note">Class 9 · Canada learning buffet · ${new Date().toLocaleDateString('en-GB')}</p></div><div class="bottomline noprint"><span class="hint">Your name stays in this tab only. Reloading clears all scores and your name.</span></div></section>`;$('#backCert').onclick=goHome;$('#printCert').onclick=()=>window.print();window.scrollTo({top:0,behavior:'instant'})}
function askRestart(){let host=$('#modalHost');host.innerHTML=`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="restartTitle"><h3 id="restartTitle">↻ Start a new adventure?</h3><p>This erases all points and completed games in the current tab.</p><button class="btn coral" id="confirmRestart">Yes, restart</button><button class="btn mint" id="cancelRestart">Keep playing</button></div></div>`;$('#cancelRestart').onclick=()=>host.innerHTML='';$('#confirmRestart').onclick=()=>{host.innerHTML='';cleanup();startSession();goHome()}}
$('#homeTop').onclick=goHome;$('#certificateTop').onclick=showCertificate;$('#restartTop').onclick=askRestart;
startSession();renderMap();
</script>
</body></html>
